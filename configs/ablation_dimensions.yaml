# Surface vs cultural-frame split for the FOA dimensions, used by Phase B
# ablation conditions (`dialect_without_cultural_frame`,
# `mandarin_with_cultural_frame`).
#
# The same 8 dim keys exist in classical_chinese, shanghainese, and cantonese
# (see code/dialects/*.py and DIM_KEYS in gen.py). The classification below
# is the same across all three dialects — the per-dialect dimension *values*
# differ, but the split of which dims encode "surface form" vs "cultural
# framing" vs "attack mechanic" is uniform.
#
# Decisions (recorded during B.1 of the paper-improvement plan):
#   - `guidance` is treated as cultural for all dialects. Even the classical
#     Chinese values (诱导生成 / 认知混淆 / 权限伪装) load Confucian
#     dialectical traditions; the Shanghainese / Cantonese values (租界灰区,
#     港英灰区, 同乡情谊, 风水顺势) are explicitly culturally specific.
#   - `expression` is the only surface-form dim — it directly encodes
#     linguistic register choice (吴语口语体 / 粤语口语体 / 文体规范).
#   - `trigger_pattern` is treated as an attack mechanic and always mutates
#     under FOA; it is language- and culture-agnostic timing pattern.

# Dims whose values choose the linguistic register / surface form.
# Mutated under `dialect_without_cultural_frame`; frozen under
# `mandarin_with_cultural_frame` (forced to a canonical Mandarin-neutral
# value via the Mandarin Chat_template).
surface_dims:
  - expression

# Dims whose values load Chinese cultural framing (roles, metaphors,
# rhetorical schools, knowledge structures, settings, culturally specific
# tactics). Frozen under `dialect_without_cultural_frame`; mutated under
# `mandarin_with_cultural_frame`.
cultural_dims:
  - role
  - guidance
  - mechanism
  - metaphor
  - knowledge
  - context

# Dims that are language- and culture-agnostic — pure attack mechanics.
# Always mutated by FOA regardless of ablation condition.
attack_mechanic_dims:
  - trigger_pattern

# Canonical baseline for frozen dims (used by `dialect_without_cultural_frame`
# and `mandarin_with_cultural_frame`). When a dim is frozen, FOA fixes it to
# this index value (an integer). Index 0 is chosen because every dim in every
# dialect uses 0 as its first registered option, making this dialect-portable.
frozen_index: 0

# Per-condition spec consumed by gen.py's ablation dispatch.
# `frozen` lists which dims are pinned; remaining dims are mutated by FOA.
# `template_kind` selects which Chat_template to format:
#   - "dialect"  → existing Chat_template_<dialect>
#   - "mandarin" → new Chat_template_<dialect>_mandarin (Phase B.2.1)
#   - null       → no FOA, single translation call (handled outside FOA)
# `surface_form` is the language we expect the rendered prompt to be in,
# stored on each JSONL row for downstream filtering.
conditions:
  english_original:
    foa: false
    frozen: []
    template_kind: null
    surface_form: english
  mandarin_translation:
    foa: false
    frozen: []
    template_kind: null
    surface_form: mandarin
  naive_dialect_translation:
    foa: false
    frozen: []
    template_kind: null
    surface_form: dialect
  dialect_without_cultural_frame:
    foa: true
    frozen: [role, guidance, mechanism, metaphor, knowledge, context]
    template_kind: dialect
    surface_form: dialect
  mandarin_with_cultural_frame:
    foa: true
    frozen: [expression]
    template_kind: mandarin
    surface_form: mandarin
  full_dialect_cultural_frame:
    foa: true
    frozen: []
    template_kind: dialect
    surface_form: dialect

  # Generic controls: FOA with culture-neutral strategy space (dialects.generic).
  # Used to test whether structured optimization achieves high ASR independent
  # of any dialect or cultural framing.  Run with --dialect generic.
  foa_generic_english:
    foa: true
    frozen: []
    template_kind: generic_english
    surface_form: english
  foa_generic_mandarin:
    foa: true
    frozen: []
    template_kind: generic_mandarin
    surface_form: mandarin
  foa_generic_chinese_register:
    foa: true
    frozen: []
    template_kind: generic_chinese_register
    surface_form: mandarin
